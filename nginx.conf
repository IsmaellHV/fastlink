upstream fastlink_frontend {
  server frontend:80;
  keepalive 32;
}

server {
  listen 80;
  listen [::]:80;
  server_name _;

  # Security headers
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "no-referrer-when-downgrade" always;

  # Gzip
  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_comp_level 5;
  gzip_min_length 256;
  gzip_types
    text/plain
    text/css
    text/javascript
    application/javascript
    application/json
    application/xml
    application/xml+rss
    image/svg+xml;

  # Timeouts
  proxy_connect_timeout 5s;
  proxy_send_timeout 30s;
  proxy_read_timeout 30s;

  # Long cache for build assets (Astro emits hashed filenames in /_astro/)
  location ~* ^/(?:fastlink/)?_astro/ {
    proxy_pass http://fastlink_frontend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # API proxy endpoint — never cache
  location ~* ^/(?:fastlink/)?api/ {
    proxy_pass http://fastlink_frontend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    add_header Cache-Control "no-store" always;
  }

  # Sitemap + robots — pass through, light cache
  location ~ ^/(?:fastlink/)?(sitemap.*\.xml|robots\.txt|favicon\.svg|favicon\.ico)$ {
    proxy_pass http://fastlink_frontend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    expires 1h;
    add_header Cache-Control "public, max-age=3600";
  }

  # Default — SSR HTML (do not cache)
  location / {
    proxy_pass http://fastlink_frontend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
  }

  error_page 502 503 504 /50x.html;
  location = /50x.html {
    return 503 "Service temporarily unavailable\n";
  }
}
